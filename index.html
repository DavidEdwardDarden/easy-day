<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#8FA888">
<title>easy day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #8FA888;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .screen {
    position: fixed;
    inset: 0;
    background: #8FA888;
    overflow: hidden;
    cursor: text;
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  #ghost {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
    z-index: 20;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    cursor: text;
    font-size: 16px;
    -webkit-user-select: text;
    user-select: text;
  }

  .wordmark {
    position: absolute;
    top: max(2.5rem, env(safe-area-inset-top, 0px) + 1.5rem);
    left: 2rem;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 13px;
    font-weight: 300;
    letter-spacing: .2em;
    color: #EDE8DF;
    opacity: .38;
    text-transform: lowercase;
    pointer-events: none;
    z-index: 5;
    transition: opacity 2.5s ease;
  }
  .wordmark.gone { opacity: 0; }

  .hint {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -54%);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 20px;
    font-style: italic;
    color: #EDE8DF;
    pointer-events: none;
    z-index: 4;
    white-space: nowrap;
    text-align: center;
    transition: opacity 1.2s ease;
    letter-spacing: .02em;
  }

  .poem-wrap {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    padding: max(5rem, env(safe-area-inset-top, 0px) + 4rem) 2.2rem max(4rem, env(safe-area-inset-bottom, 0px) + 3rem);
    pointer-events: none;
    z-index: 3;
    overflow: hidden;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(22px, 6vw, 28px);
    font-weight: 300;
    font-style: italic;
    line-height: 1.85;
    word-break: break-word;
  }

  .cursor {
    display: inline-block;
    width: 1.5px;
    height: 1.05em;
    background: #F0E8DC;
    opacity: .7;
    vertical-align: text-bottom;
    animation: blink 1.1s ease-in-out infinite;
    margin-left: 1px;
  }

  @keyframes blink {
    0%, 100% { opacity: .7; }
    50%       { opacity: 0; }
  }
</style>
</head>
<body>
<div class="screen" id="screen">
  <canvas id="c"></canvas>
  <textarea id="ghost" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
  <div class="wordmark" id="wordmark">easy day</div>
  <div class="hint" id="hint">begin anywhere</div>
  <div class="poem-wrap" id="poemWrap"></div>
</div>

<script>
const ghost    = document.getElementById('ghost');
const wrap     = document.getElementById('poemWrap');
const hint     = document.getElementById('hint');
const screen   = document.getElementById('screen');
const canvas   = document.getElementById('c');
const ctx      = canvas.getContext('2d');
const wordmark = document.getElementById('wordmark');

let poem = '', speed = 0, dotEnergy = 0;
let lastKey = 0, lastTyped = 0, started = false;
let last = performance.now();
let chars = [], spans = [], idlePulse = 0;

// ── canvas sizing ─────────────────────────────────────────
function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── color journey: 5 phases ───────────────────────────────
const CREAM = [240, 232, 220];
const ROSE  = [228, 182, 172];
const BLOOD = [175,  85,  75];
const DARK  = [112,  42,  38];
const VIVID = [212,  58,  44];

const FAST_TAU = 10200;
const SLOW_TAU = 300000;
const FLOOR    = 0.10;

const ROSE_S  =  12000;
const ROSE_E  =  27000;
const BLOOD_S =  32400;
const BLOOD_E =  50760;
const DARK_S  =  55440;
const DARK_E  =  84960;
const VIVID_S =  92000;
const VIVID_E = 118000;

function lerp(a, b, t) { return Math.round(a + (b - a) * t); }
function smooth(t)      { return t * t * (3 - 2 * t); }
function clamp(t)       { return Math.max(0, Math.min(1, t)); }

function charOp(ea) {
  const base       = FLOOR + 0.06 * Math.exp(-ea / SLOW_TAU) + 0.84 * Math.exp(-ea / FAST_TAU);
  const darkBoost  = smooth(clamp((ea - DARK_S)  / (DARK_E  - DARK_S)))  * 0.10;
  const vividBoost = smooth(clamp((ea - VIVID_S) / (VIVID_E - VIVID_S))) * 0.28;
  return base + darkBoost + vividBoost;
}

function charColor(ea) {
  if (ea < ROSE_S)  return CREAM;
  if (ea < ROSE_E)  { const t = smooth(clamp((ea - ROSE_S)  / (ROSE_E  - ROSE_S)));  return [lerp(CREAM[0], ROSE[0],  t), lerp(CREAM[1], ROSE[1],  t), lerp(CREAM[2], ROSE[2],  t)]; }
  if (ea < BLOOD_S) return ROSE;
  if (ea < BLOOD_E) { const t = smooth(clamp((ea - BLOOD_S) / (BLOOD_E - BLOOD_S))); return [lerp(ROSE[0],  BLOOD[0], t), lerp(ROSE[1],  BLOOD[1], t), lerp(ROSE[2],  BLOOD[2], t)]; }
  if (ea < DARK_S)  return BLOOD;
  if (ea < DARK_E)  { const t = smooth(clamp((ea - DARK_S)  / (DARK_E  - DARK_S)));  return [lerp(BLOOD[0], DARK[0],  t), lerp(BLOOD[1], DARK[1],  t), lerp(BLOOD[2], DARK[2],  t)]; }
  if (ea < VIVID_S) return DARK;
  const t = smooth(clamp((ea - VIVID_S) / (VIVID_E - VIVID_S)));
  return [lerp(DARK[0], VIVID[0], t), lerp(DARK[1], VIVID[1], t), lerp(DARK[2], VIVID[2], t)];
}

// ── idle bell curve ───────────────────────────────────────
const IDLE_WAIT = 15000, BELL_UP = 8000, BELL_HOLD = 5000, BELL_DOWN = 22000;

function calcIdlePulse(now) {
  if (!lastTyped) return 0;
  const idle = now - lastTyped;
  if (idle < IDLE_WAIT) return 0;
  const t = idle - IDLE_WAIT;
  if (t < BELL_UP)                       return smooth(t / BELL_UP);
  if (t < BELL_UP + BELL_HOLD)           return 1.0;
  if (t < BELL_UP + BELL_HOLD + BELL_DOWN) return smooth(1 - (t - BELL_UP - BELL_HOLD) / BELL_DOWN);
  return 0;
}

// ── particles ─────────────────────────────────────────────
const BASE_N = 42, BURST_N = 118, TOTAL_N = BASE_N + BURST_N;
const PCOLS  = [[240,232,220],[212,178,150],[200,213,192],[217,175,165],[230,220,204]];

function mkP(i) {
  const W = canvas.width || window.innerWidth;
  const H = canvas.height || window.innerHeight;
  const s = Math.random(), c = PCOLS[Math.floor(Math.random() * PCOLS.length)];
  let x, y, angle;
  if      (s < .40) { x = 0; y = Math.random() * H; angle = Math.random() * .6 - .15; }
  else if (s < .70) { x = Math.random() * W; y = 0; angle = Math.PI / 2 + Math.random() * .6 - .3; }
  else if (s < .85) { x = W; y = Math.random() * H; angle = Math.PI + Math.random() * .6 - .15; }
  else              { x = Math.random() * W; y = H; angle = -Math.PI / 2 + Math.random() * .6 - .3; }
  return {
    x, y, angle,
    spd:        .20 + Math.random() * .55,
    r:          1.2  + Math.random() * 1.8,
    baseAlpha:  .20  + Math.random() * .24,
    wobble:     (Math.random() - .5) * .011,
    wobbleFreq: .009 + Math.random() * .016,
    wobbleOff:  Math.random() * Math.PI * 2,
    color: c, t: 0,
    drift:      (Math.random() - .5) * .003,
    isBurst:    i >= BASE_N
  };
}

const parts = Array.from({ length: TOTAL_N }, (_, i) => {
  const p = mkP(i);
  p.x = Math.random() * (window.innerWidth);
  p.y = Math.random() * (window.innerHeight);
  return p;
});

function drawParts(energy, pulse) {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const visBoost = 1 + pulse * 0.50;
  const spdScale = 1 - pulse * 0.28;
  parts.forEach((p, i) => {
    const vis   = p.isBurst
      ? Math.min(1, Math.pow(energy, 0.55) * 1.7)
      : Math.max(0.54, 0.54 + energy * 0.46);
    const alpha = p.baseAlpha * vis * visBoost * (1 + energy * .5);
    if (alpha < 0.012) return;
    p.t++;
    p.angle += p.wobble + Math.sin(p.t * p.wobbleFreq + p.wobbleOff) * p.drift;
    const s = p.spd * (1 + energy * 2.8) * spdScale;
    p.x += Math.cos(p.angle + (energy * (Math.random() - .5) * .035)) * s;
    p.y += Math.sin(p.angle + (energy * (Math.random() - .5) * .035)) * s;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (1 + pulse * .15), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${alpha.toFixed(3)})`;
    ctx.fill();
    if (p.x < -4 || p.x > W + 4 || p.y < -4 || p.y > H + 4) Object.assign(p, mkP(i));
  });
}

// ── chars ─────────────────────────────────────────────────
function getCursor() { return wrap.querySelector('.cursor'); }

function addChars(newText) {
  const cur = getCursor(); if (cur) wrap.removeChild(cur);
  const now = performance.now();
  for (const ch of newText) {
    const ageFactor = 1 + speed * 1.4;
    if (ch === '\n') {
      const br = document.createElement('br');
      wrap.appendChild(br);
      chars.push({ char: '\n', createdAt: now, ageFactor });
      spans.push(br);
    } else {
      const sp = document.createElement('span');
      sp.textContent = ch;
      sp.style.color   = `rgb(${CREAM[0]},${CREAM[1]},${CREAM[2]})`;
      sp.style.opacity = '1';
      wrap.appendChild(sp);
      chars.push({ char: ch, createdAt: now, ageFactor });
      spans.push(sp);
    }
  }
  const c2 = document.createElement('span');
  c2.className = 'cursor';
  wrap.appendChild(c2);
}

function updateChars(now) {
  chars.forEach((c, i) => {
    if (c.char === '\n') return;
    const ea = (now - c.createdAt) * c.ageFactor;
    spans[i].style.opacity = charOp(ea).toFixed(4);
    const col = charColor(ea);
    spans[i].style.color = `rgb(${col[0]},${col[1]},${col[2]})`;
  });
}

// ── main loop ─────────────────────────────────────────────
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(now - last, 50); last = now;
  speed     *= Math.pow(0.94,  dt / 16);
  dotEnergy *= Math.pow(0.997, dt / 16);
  idlePulse  = calcIdlePulse(now);
  drawParts(dotEnergy, idlePulse);
  if (started) updateChars(now);
}
requestAnimationFrame(loop);

// ── input ─────────────────────────────────────────────────
let prevLen = 0;

ghost.addEventListener('keydown', e => {
  if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); return; }
  if ((e.ctrlKey || e.metaKey) && 'acxzy'.includes(e.key)) { e.preventDefault(); return; }
  const now = performance.now(), gap = now - lastKey;
  lastTyped = now;
  if (lastKey && gap < 600) {
    const burst = Math.pow(Math.max(0, 1 - gap / 600), .7);
    speed     = Math.min(1, speed     + burst * .32);
    dotEnergy = Math.min(1, dotEnergy + burst * .38);
  }
  lastKey = now;
});

ghost.addEventListener('beforeinput', e => {
  if (e.inputType && (e.inputType.startsWith('delete') || e.inputType.startsWith('history')))
    e.preventDefault();
});

ghost.addEventListener('input', () => {
  const val = ghost.value;
  if (val.length < poem.length) { ghost.value = poem; return; }
  const newText = val.slice(prevLen);
  poem = val; prevLen = poem.length;
  if (!started && poem.length > 0) {
    started = true;
    hint.style.opacity = '0';
    wordmark.classList.add('gone');
    const cur = getCursor(); if (cur) wrap.removeChild(cur);
  }
  if (newText) addChars(newText);
});

document.addEventListener('copy', e => e.preventDefault());
document.addEventListener('cut',  e => e.preventDefault());
screen.addEventListener('contextmenu', e => e.preventDefault());
screen.addEventListener('click', () => ghost.focus());
screen.addEventListener('touchstart', () => ghost.focus(), { passive: true });

ghost.focus();

// initial cursor
const initCur = document.createElement('span');
initCur.className = 'cursor';
wrap.appendChild(initCur);
</script>
</body>
</html>
